# The web app's gates and its deployment (web/PLAN.md §11).
#
# `ci.yml` stays untouched and `rust/`-scoped. This workflow exists because
# `web/crate` deliberately lives outside the `rust/` workspace (web/PLAN.md D1), so
# `cd rust && cargo …` cannot see it: the fmt/clippy/test steps below are the gates
# the binding would otherwise lose by being a standalone package.
#
# Same toolchain philosophy as `ci.yml`: the runner's own rustup, and no third-party
# actions — only `actions/checkout`, `actions/cache`, `actions/setup-node`,
# `actions/upload-pages-artifact`, `actions/configure-pages` and
# `actions/deploy-pages`, all first-party.

name: Web

# `rust/Cargo.toml` and `rust/Cargo.lock` are in the filters because `web/crate` depends
# on `techxt` by path and inherits the workspace's dependency pins through it: since M9
# that includes techy-xp, whose revision can move without a byte of `rust/techxt/**`
# changing. A build the app's own gates never saw is exactly what the filters exist to
# prevent.
on:
  push:
    paths:
      - "web/**"
      - "rust/techxt/**"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "rust/techxt/**"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # §4.7 and §14: the finished binding is 939 KB raw / 333 KB gzipped — larger than
  # the 890/296 the plan measured from a bare `fn convert(&str) -> String` probe,
  # because the real surface carries the serde derives and techy's
  # `Diagnostic::render()`, which the panel's `rendered` field needs. The budget is
  # roughly 20 % over the measured figure, so a dependency mistake shows up as a
  # failed build rather than a slow page.
  #
  # **The two values below are the only authoritative copy of the size ceiling.** The
  # plan (§4.7, §11, §14) describes the policy and records measurements but deliberately
  # restates neither number, so a budget change is a one-file edit and cannot go stale
  # in prose.
  #
  # The gzip ceiling started at the figure §4.7 names as the point to drop to
  # `opt-level = "s"`, so CI fails exactly when the plan says the size/speed trade
  # should be revisited — not before. It did that: M9 took the module to 1 120 513 B
  # raw / 398 525 B gzipped (§14), leaving 29 KB and **1.4 KB** of headroom, and M10
  # (the render side made generic over `LatexlikeLang`) then spent the gzip headroom
  # without a re-measure and tripped the wire at 401 841 B.
  #
  # **The owner's call, 2026-08-28: raise the gzip ceiling for now** rather than take
  # §4.7's first response (`opt-level = "s"`, measured at 344 828 B gzipped — 56 KB
  # back, at a speed cost still unmeasured). A deferral, not a reversal: `"s"` is still
  # the answer, and what it waits on is the browser-side speed comparison §14's profile
  # table has wanted since W1. The answer to a *second* firing is that measurement, not
  # another raise.
  #
  # The **raw** ceiling is deliberately left where it was: the same build sits 19 608 B
  # (1.7 %) under it, proportionally tighter than the gzip line now is, so raw is the
  # likelier of the two to fire next.
  WASM_MAX_BYTES: 1150000
  WASM_MAX_GZIP_BYTES: 450000

jobs:
  web:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the stable toolchain and the wasm target
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/wasm-pack
            web/crate/target
            rust/target
          key: web-${{ runner.os }}-${{ hashFiles('web/crate/Cargo.lock', 'rust/Cargo.lock') }}
          restore-keys: web-${{ runner.os }}-

      # The gates `web/crate` loses by living outside the `rust/` workspace (D1).
      # `[lints]` in its manifest copies `rust/`'s policy, so `missing_docs` is denied
      # here too.
      - name: Formatting (web/crate)
        working-directory: web/crate
        run: cargo fmt --all --check

      - name: Clippy (web/crate)
        working-directory: web/crate
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (web/crate)
        working-directory: web/crate
        run: cargo test

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install node dependencies
        working-directory: web
        run: npm ci

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null; then
            cargo install wasm-pack --locked
          fi
          wasm-pack --version

      - name: Build the wasm module
        working-directory: web
        run: npm run wasm

      # §11 step 3. A module that outgrows this is not necessarily wrong, but it is a
      # decision, and §4.7 names `opt-level = "s"` as the first thing to try.
      - name: Assert the wasm size budget
        working-directory: web
        run: |
          raw=$(stat -c%s crate/pkg/techxt_web_bg.wasm)
          gz=$(gzip -9 -c crate/pkg/techxt_web_bg.wasm | wc -c)
          echo "wasm: ${raw} B raw, ${gz} B gzipped" | tee -a "$GITHUB_STEP_SUMMARY"
          fail=0
          if [ "$raw" -gt "$WASM_MAX_BYTES" ]; then
            echo "::error::wasm is ${raw} B raw, over the ${WASM_MAX_BYTES} B budget (web/PLAN.md §4.7)"
            fail=1
          fi
          if [ "$gz" -gt "$WASM_MAX_GZIP_BYTES" ]; then
            echo "::error::wasm is ${gz} B gzipped, over the ${WASM_MAX_GZIP_BYTES} B budget (web/PLAN.md §4.7)"
            fail=1
          fi
          exit $fail

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Build the app
        working-directory: web
        run: npx vite build

      # §8.5. The default face is a hard gate — the out-of-the-box rendering of
      # techxt's own output is not allowed to regress. The other four warn into the
      # job summary: a handful of gaps filled by the fallback chain is a documented
      # fact about a face, not a bug.
      - name: Glyph coverage
        run: |
          pip install --quiet fonttools brotli
          python3 web/tools/coverage_check.py --check

      # §11 step 6. The numbers live in `fetch_fonts.py`, beside the fonts they are
      # about, so CI and a developer running the script locally cannot disagree —
      # and so the reason a budget moved sits next to the value.
      - name: Assert the font budget
        run: python3 web/tools/fetch_fonts.py --budget | tee -a "$GITHUB_STEP_SUMMARY"

      # The committed faces are what ships; a file edited in place would otherwise
      # never be noticed.
      - name: Verify the committed fonts against SOURCES.md
        run: python3 web/tools/fetch_fonts.py --check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A group of its own, and no cancellation: a rapid second push should queue
    # behind the first deployment rather than race it.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
