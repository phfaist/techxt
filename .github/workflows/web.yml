# The web app's gates and its deployment (web/PLAN.md §11).
#
# `ci.yml` stays untouched and `rust/`-scoped. This workflow exists because
# `web/crate` deliberately lives outside the `rust/` workspace (web/PLAN.md D1), so
# `cd rust && cargo …` cannot see it: the fmt/clippy/test steps below are the gates
# the binding would otherwise lose by being a standalone package.
#
# Same toolchain philosophy as `ci.yml`: the runner's own rustup, and no third-party
# actions — only `actions/checkout`, `actions/cache`, `actions/setup-node`,
# `actions/upload-pages-artifact`, `actions/configure-pages` and
# `actions/deploy-pages`, all first-party.

name: Web

# `rust/Cargo.toml` and `rust/Cargo.lock` are in the filters because `web/crate` depends
# on `techxt` by path and inherits the workspace's dependency pins through it: since M9
# that includes techy-xp, whose revision can move without a byte of `rust/techxt/**`
# changing. A build the app's own gates never saw is exactly what the filters exist to
# prevent.
on:
  push:
    paths:
      - "web/**"
      - "rust/techxt/**"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "rust/techxt/**"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # **The four values below are the only authoritative copy of the size ceilings.** The
  # plan (§4.7, §9.1, §11, §14) describes the policy and records measurements but
  # deliberately restates none of the numbers, so a budget change is a one-file edit and
  # cannot go stale in prose.
  #
  # ## The wasm module
  #
  # Set at the size pass (TODO item 6) against a module built `opt-level = "s"` +
  # `wasm-opt -Os`: **971 601 B raw / 370 323 B gzipped**. That profile is itself the
  # outcome of the pass. The wire had by then fired twice — the gzip line at M10, and
  # the raw line as items 1-5 landed (1 241 264 B against a 1 150 000 B ceiling) — and
  # the answer to the first firing was recorded as a deferral pending a browser-side
  # speed comparison. §14 now has that comparison, so the second firing gets the
  # decision rather than a third raise. `"s"` costs about a fifth of the conversion CPU
  # on a 45 KB document and nothing measurable on the few-kilobyte documents people
  # actually write; behind a Worker and a 120 ms debounce it never touches a keystroke.
  # So the trade was taken, and these ceilings are *lower* than the ones they replace
  # even though the module has grown three features since they were set.
  #
  # The headroom is about 13 % on each, and it is sized from two things rather than a
  # round percentage:
  #
  #   - **The toolchain moves the number by more than a feature does.** The same commit
  #     measured 1 199 689 B on a container's rustc 1.94 and 1 120 513 B on a newer
  #     stable (§14) — a 6.6 % spread that a budget must absorb, or CI turns red when a
  #     runner image updates and tells us nothing about the code.
  #   - **One substantial binding feature.** The completion surface cost 33 933 B raw /
  #     15 627 B gzipped; the curated ranking 4 290 B / 1 628 B. What is left after the
  #     toolchain spread is roughly one more of those, which is the point: the wire
  #     should fire when a feature adds real weight, so the trade is looked at again,
  #     and not before.
  #
  # §4.7 still owns the policy, and its first response to an overrun is now `"z"` —
  # `"s"` having been spent here.
  WASM_MAX_BYTES: 1100000
  WASM_MAX_GZIP_BYTES: 415000
  # ## MathJax
  #
  # The typesetter is a lazily fetched asset, not part of the bundle (§9.1), so nothing
  # above covers it and a mistake there is invisible to every other gate in this file.
  # Two numbers, because they fail in different ways:
  #
  #   - `MATHJAX_MAX_BYTES` is the whole `dist/mathjax/` tree — the bundle, the metric
  #     ranges and the woff2 faces. It is what a `git push` costs and what an installed
  #     copy may eventually hold. Measured at **3 171 162 B**. Its real job is to catch a
  #     switch back to the SVG output, whose font ranges carry path data instead of
  #     metrics and weigh 11 817 943 B — nearly four times this ceiling, so the mistake
  #     cannot land quietly.
  #   - `MATHJAX_MAX_GZIP_BYTES` is `tex-chtml.js` alone, gzipped: **280 899 B**, and the
  #     one download every user of the mode actually pays for. The tree can grow a font
  #     without anyone noticing; this number growing means the page got slower.
  #
  # 13 % of headroom on both, matching the wasm lines. There is no toolchain spread here
  # — these files are copied verbatim from the npm package — so the margin is entirely
  # room for a MathJax version bump, and a bump that spends it deserves a look.
  MATHJAX_MAX_BYTES: 3600000
  MATHJAX_MAX_GZIP_BYTES: 320000

jobs:
  web:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the stable toolchain and the wasm target
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/wasm-pack
            web/crate/target
            rust/target
          key: web-${{ runner.os }}-${{ hashFiles('web/crate/Cargo.lock', 'rust/Cargo.lock') }}
          restore-keys: web-${{ runner.os }}-

      # The gates `web/crate` loses by living outside the `rust/` workspace (D1).
      # `[lints]` in its manifest copies `rust/`'s policy, so `missing_docs` is denied
      # here too.
      - name: Formatting (web/crate)
        working-directory: web/crate
        run: cargo fmt --all --check

      - name: Clippy (web/crate)
        working-directory: web/crate
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (web/crate)
        working-directory: web/crate
        run: cargo test

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install node dependencies
        working-directory: web
        run: npm ci

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null; then
            cargo install wasm-pack --locked
          fi
          wasm-pack --version

      - name: Build the wasm module
        working-directory: web
        run: npm run wasm

      # §11 step 3. A module that outgrows this is not necessarily wrong, but it is a
      # decision, and §4.7 names what to try first — `"z"` now, `"s"` having been taken.
      - name: Assert the wasm size budget
        working-directory: web
        run: |
          raw=$(stat -c%s crate/pkg/techxt_web_bg.wasm)
          gz=$(gzip -9 -c crate/pkg/techxt_web_bg.wasm | wc -c)
          echo "wasm: ${raw} B raw, ${gz} B gzipped" | tee -a "$GITHUB_STEP_SUMMARY"
          fail=0
          if [ "$raw" -gt "$WASM_MAX_BYTES" ]; then
            echo "::error::wasm is ${raw} B raw, over the ${WASM_MAX_BYTES} B budget (web/PLAN.md §4.7)"
            fail=1
          fi
          if [ "$gz" -gt "$WASM_MAX_GZIP_BYTES" ]; then
            echo "::error::wasm is ${gz} B gzipped, over the ${WASM_MAX_GZIP_BYTES} B budget (web/PLAN.md §4.7)"
            fail=1
          fi
          exit $fail

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Build the app
        working-directory: web
        run: npx vite build

      # §9.1. The typesetter is copied into `dist/` rather than bundled, so it is
      # invisible to Rollup's own reporting and to every other gate here. This is the
      # only thing standing between a MathJax upgrade — or an output-format change — and
      # eleven megabytes landing in the repository unremarked.
      - name: Assert the MathJax asset budget
        working-directory: web
        run: |
          tree=$(du -sb dist/mathjax | cut -f1)
          gz=$(gzip -9 -c dist/mathjax/*/tex-chtml.js | wc -c)
          echo "mathjax: ${tree} B in dist/, bundle ${gz} B gzipped" | tee -a "$GITHUB_STEP_SUMMARY"
          fail=0
          if [ "$tree" -gt "$MATHJAX_MAX_BYTES" ]; then
            echo "::error::the MathJax tree is ${tree} B, over the ${MATHJAX_MAX_BYTES} B budget (web/PLAN.md §9.1)"
            fail=1
          fi
          if [ "$gz" -gt "$MATHJAX_MAX_GZIP_BYTES" ]; then
            echo "::error::tex-chtml.js is ${gz} B gzipped, over the ${MATHJAX_MAX_GZIP_BYTES} B budget (web/PLAN.md §9.1)"
            fail=1
          fi
          exit $fail

      # §8.5. The default face is a hard gate — the out-of-the-box rendering of
      # techxt's own output is not allowed to regress. The other four warn into the
      # job summary: a handful of gaps filled by the fallback chain is a documented
      # fact about a face, not a bug.
      - name: Glyph coverage
        run: |
          pip install --quiet fonttools brotli
          python3 web/tools/coverage_check.py --check

      # §11 step 6. The numbers live in `fetch_fonts.py`, beside the fonts they are
      # about, so CI and a developer running the script locally cannot disagree —
      # and so the reason a budget moved sits next to the value.
      - name: Assert the font budget
        run: python3 web/tools/fetch_fonts.py --budget | tee -a "$GITHUB_STEP_SUMMARY"

      # The committed faces are what ships; a file edited in place would otherwise
      # never be noticed.
      - name: Verify the committed fonts against SOURCES.md
        run: python3 web/tools/fetch_fonts.py --check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A group of its own, and no cancellation: a rapid second push should queue
    # behind the first deployment rather than race it.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
