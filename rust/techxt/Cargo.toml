[package]
name = "techxt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Convert LaTeX-like markup to plain (unicode) text"
readme = "../../README.md"
license.workspace = true
repository.workspace = true
keywords = ["latex", "text", "unicode", "converter", "flm"]
categories = ["text-processing", "value-formatting"]

[lints]
workspace = true

# `xp` (on by default) adds techy-xp's `LatexlikeXp` as a parse language — the honored
# defining commands, the expansion budgets — and the argument-free constructors built
# on it. Without it techxt is generic over the parse language only, techy's plain
# `Latexlike` is the ready-made one, and techy-xp is neither compiled nor linked.
[features]
default = ["xp"]
xp = ["dep:techy-xp"]

# At most three runtime dependencies, all no_std + alloc: techy and unicode-width
# always, and techy-xp (which brings techy's own map choice, hashbrown, as the one
# transitive addition) with the `xp` feature.
#
# techy default features are empty (its only feature, `serde`, is opt-in), so nothing
# has to be turned off here to keep the no_std build honest; the CI `no_std` job
# builds this crate for `thumbv7em-none-eabihf` and would catch a regression.
# unicode-width's default `cjk` feature is data only, not std.
[dependencies]
techy.workspace = true
techy-xp = { workspace = true, optional = true }
unicode-width.workspace = true

# proptest drives the layout and joiner invariants. Tests are the one
# place where this crate links std (`#![cfg_attr(not(test), no_std)]`).
[dev-dependencies]
proptest.workspace = true
