[workspace]
# A virtual workspace root has no `edition` to infer the resolver from, so pin it
# explicitly: v1 would unify features across the no_std library and the std-linking
# CLI, and could drag std into `techxt` through a shared dependency.
#
# v3 rather than techy's v2 because it additionally makes dependency resolution
# MSRV-aware: cargo then declines a dependency version whose own `rust-version`
# exceeds ours. The CLI's `stacker` needs this — `psm` 0.1.31 requires 1.88, and
# under v2 a bare `cargo update` would silently pick it and break the MSRV job.
# Resolver v3 needs only Cargo 1.84, below this workspace's own 1.86 floor.
resolver = "3"
members = ["techxt", "techxt-cli"]

# Shared metadata inherited by member crates (`<field>.workspace = true`).
[workspace.package]
version = "0.1.1"
edition = "2021"
# Matches techy's MSRV: techxt is built on techy and cannot compile on a toolchain
# older than the parser it embeds. techy pins 1.86 for dyn trait upcasting to
# `dyn Any` in its diagnostics payloads.
rust-version = "1.86"
authors = ["Philippe Faist"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/phfaist/techxt"

# Workspace-wide lint policy; members opt in with `[lints] workspace = true`.
# missing_docs is "deny" from day one: an undocumented public item
# fails the build rather than shipping a blank rustdoc entry.
# broken_intra_doc_links is "deny" so documentation link rot fails the `cargo doc`
# build instead of silently producing dead links.
[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
bare_urls = "warn"

# Dependency versions live here so the members stay in lockstep and a bump is a
# one-line change. The runtime set is fixed: `techxt` may depend on exactly `techy`,
# `techy-xp` and `unicode-width` (techy-xp's own deps are techy and `hashbrown`, both
# already in the tree, so the crate graph gains no new node), `techxt-cli` on `techxt`
# and `clap` — plus, for the CLI only, `stacker`. The CLI does *not* depend on techy:
# everything of techy's that it names — `SourceResolver`, the `Recovery` policy
# `--strict` selects, the `Diagnostics` it filters and renders — is re-exported by
# `techxt::convert`, which is what keeps an embedder at one dependency.
[workspace.dependencies]
techy = "0.1"
# Macro definition and expansion for techy's latexlike preset: the
# `LatexlikeXp` language and `XpDriver` the converter parses through, so that
# `\newcommand`, `\def` and friends are expanded at token-reading time. techy-xp
# depends on techy itself, so a bump of one usually means a bump of the other: the
# two must resolve to a single techy in the lockfile.
techy-xp = "0.1"
# East-Asian-width-aware display width of the rendered text, for the layout engine's
# column accounting. no_std-capable and dependency-free.
unicode-width = "0.2"
clap = { version = "4", features = ["derive"] }
# The std caller's stack probe. techy's descent guard is
# `no_std` and cannot ask the operating system how much stack is left, so its default
# is a deliberately tight fixed budget; `techxt-cli` links std and can do better, and
# `stacker::remaining_stack()` is exactly the `fn() -> Option<usize>` probe that
# `StdDescentGuardInit::computed_stack_budget` wants. CLI-only: `techxt` itself must
# stay no_std.
stacker = "0.1"
proptest = "1"

# Profiles apply workspace-wide and are only honored in the workspace root manifest.
[profile.release]
lto = true
codegen-units = 1
