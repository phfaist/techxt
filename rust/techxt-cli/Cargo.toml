[package]
name = "techxt-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Command-line converter from LaTeX-like markup to plain (unicode) text"
readme = "../../README.md"
license.workspace = true
repository.workspace = true
keywords = ["latex", "text", "unicode", "converter", "cli"]
categories = ["command-line-utilities", "text-processing"]

[lints]
workspace = true

# The crate is `techxt-cli` but the installed command is `techxt` (PLAN.md §2): the
# binary name is what users type, the package name only disambiguates it from the
# library in the workspace and on crates.io.
[[bin]]
name = "techxt"
path = "src/main.rs"
# The binary and the library share the name `techxt`, and rustdoc writes both to
# `target/doc/techxt/` — a documented cargo bug (rust-lang/cargo#6313) that makes
# `cargo doc --workspace` warn about the filename collision. The binary has no API to
# document, so opting it out of rustdoc keeps the doc build warning-free; the CLI's own
# documentation is its `--help` output and the README. Public items here are still held
# to `missing_docs` by the ordinary compile.
doc = false

# The CLI is a std program: it owns file and stream I/O, the sandboxed `\input`
# resolver and the system clock, none of which the no_std library may touch.
[dependencies]
techxt = { path = "../techxt", version = "0.1.0" }
# No `techy` here, deliberately. Everything the CLI needs of techy — `SourceResolver`
# and `check_include_chain` for the sandboxed `\input` resolver, `Recovery::Strict` for
# `--strict`, `Diagnostics` and `Severity` for the report — is re-exported by
# `techxt::convert`, and this program is the proof that the re-exports are sufficient:
# an embedder takes one dependency, not two (PLAN.md §2).
clap.workspace = true
# Only the CLI may link this: it measures the real thread stack so that the descent
# guard can use it (DECISIONS.md D9 item 3). See `descent_guard` in `main.rs`.
#
# MSRV note: stacker builds on `psm`, whose newer releases declare `rust-version = 1.88`
# and so cannot build on the 1.86 toolchain the MSRV job uses. The workspace root sets
# `resolver = "3"`, whose MSRV-aware resolution declines those releases on our behalf, so
# this no longer rests on the lock file alone.
#
# Resolver v3 can only honour a `rust-version` a crate actually declares, though: psm's
# `ar_archive_writer` build dependency declares none and still needs a newer compiler, so
# `Cargo.lock` remains the belt to that braces. If the MSRV job ever fails on a crate you
# did not touch, look for one that resolved forward without declaring a floor.
stacker.workspace = true
