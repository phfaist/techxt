[package]
name = "techxt-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Command-line converter from LaTeX-like markup to plain (unicode) text"
readme = "../../README.md"
license.workspace = true
repository.workspace = true
keywords = ["latex", "text", "unicode", "converter", "cli"]
categories = ["command-line-utilities", "text-processing"]

[lints]
workspace = true

# The crate is `techxt-cli` but the installed command is `techxt` (PLAN.md §2): the
# binary name is what users type, the package name only disambiguates it from the
# library in the workspace and on crates.io.
[[bin]]
name = "techxt"
path = "src/main.rs"
# The binary and the library share the name `techxt`, and rustdoc writes both to
# `target/doc/techxt/` — a documented cargo bug (rust-lang/cargo#6313) that makes
# `cargo doc --workspace` warn about the filename collision. The binary has no API to
# document, so opting it out of rustdoc keeps the doc build warning-free; the CLI's own
# documentation is its `--help` output and the README. Public items here are still held
# to `missing_docs` by the ordinary compile.
doc = false

# The CLI is a std program: it owns file and stream I/O, the sandboxed `\input`
# resolver and the system clock, none of which the no_std library may touch.
[dependencies]
techxt = { path = "../techxt", version = "0.1.0" }
# techy is a direct dependency, not just techxt's: the CLI names techy's own types to
# implement the sandboxed `\input` resolver (`SourceResolver`, `check_include_chain`),
# to select `Recovery::Strict` for `--strict`, and to filter and render `Diagnostics`.
# The workspace pin keeps it the very same revision techxt links, so the trait
# implemented here is the trait techxt's builder accepts.
techy.workspace = true
clap.workspace = true
# Only the CLI may link this: it measures the real thread stack so that the descent
# guard can use it (DECISIONS.md D9 item 3). See `descent_guard` in `main.rs`.
#
# MSRV note: stacker builds on `psm`, and psm >= 0.1.31 declares `rust-version = 1.88`
# (0.1.31 also picks up an `ar_archive_writer` build dependency that declares the same),
# which cargo's resolver refuses on the 1.86 toolchain the MSRV job uses. `Cargo.lock`
# therefore pins psm to 0.1.26, the last release that resolves on 1.86. The pin lives in
# the lock file, so a bare `cargo update` would undo it; the durable fix is either
# `resolver = "3"` in the workspace root, whose MSRV-aware resolution would pick a
# compatible psm by itself, or raising the declared MSRV.
stacker.workspace = true
