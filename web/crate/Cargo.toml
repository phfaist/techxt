[package]
name = "techxt-web"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "The wasm binding behind the techxt web app (web/PLAN.md §4)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
techxt = { path = "../../rust/techxt" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

# The lint policy of `rust/Cargo.toml`, copied verbatim rather than inherited: this
# package is deliberately outside the `rust/` workspace (web/PLAN.md D1), so it sees
# neither `[workspace.lints]` nor `rust/`'s CI, and `web/PLAN.md` §11 step 2 says it
# restores both for itself. `missing_docs = "deny"` means every public item in here
# carries a doc comment, the binding included.
[lints.rust]
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
bare_urls = "warn"

# web/PLAN.md §4.7. `opt-level = "s"` is the choice, taken at the size pass on the
# browser measurement the plan had been deferring against since W1: it costs about a
# fifth of the conversion *CPU* on a document of 45 KB or more and nothing at all on the
# few-kilobyte documents almost everyone writes, and because conversion runs in a Worker
# behind a 120 ms debounce that CPU is never in the way of a keystroke. What it buys is
# paid by every visitor instead of by the rare large document: 270 KB less to download
# and compile, and a module that starts and answers its *first* conversion measurably
# faster. `"z"` remains the measured alternative in reserve (PLAN §14).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The `--enable-*` flags are required, not cosmetic: wasm-pack ships binaryen 117, which
# predates the bulk-memory operations current rustc emits by default, and without them
# `wasm-opt` fails validation and the build breaks (PLAN §4.7, Appendix B). If a future
# wasm-pack ships a newer binaryen they become harmless.
#
# `-Os` moves with `opt-level` above, as §4.7 requires. On this module the pairing is a
# matter of intent rather than of bytes: measured at the size pass, binaryen's own flag
# is worth 6 KB raw and 200 B gzipped either way, and nothing at all in speed — rustc's
# `opt-level` is the whole of both effects.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext"]
