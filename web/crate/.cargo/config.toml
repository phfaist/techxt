# The wasm stack, raised from LLVM's 1 MiB default to 8 MiB (web/PLAN.md §4.6).
#
# This sizes the **shadow stack** in linear memory — the region address-taken Rust
# locals live in. It is worth having, but W7 measurement showed it is *not* what runs
# out first: an ordinary Rust local becomes a wasm local held in the engine's own call
# stack, which linear memory cannot see and this flag cannot size. Every deeply-nested
# document probed in Chromium died as a `RangeError: Maximum call stack size exceeded`
# with the shadow stack barely touched.
#
# That is why `src/options.rs` guards with `depth_limit` rather than the byte budget
# §4.6 first specified: address distance measures this stack, and the engine's is the
# one that matters. The constant there carries the calibration.
#
# It applies to the wasm target only, so `cargo test` on the host is unaffected.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=-zstack-size=8388608"]
